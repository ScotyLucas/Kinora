# Kinora for iPhone, iPad and Apple TV – native SwiftUI apps.
# The Xcode project is generated from this file and is not committed:
#   cd apps/ios && xcodegen        (brew install xcodegen)
# Signing: copy Config/Local.example.xcconfig to Config/Local.xcconfig and set your team.
name: Kinora
options:
  bundleIdPrefix: io.github.scotylucas
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  developmentLanguage: hu
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KinoraKit:
    path: KinoraKit
targets:
  Kinora:
    type: application
    platform: iOS
    sources:
      - path: Kinora
    dependencies:
      - package: KinoraKit
      - target: KinoraWidgets
      - target: KinoraNotifications
      - target: KinoraMessages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID)
        PRODUCT_NAME: Kinora
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    # The App Group carries the saved servers and the login token to the widgets.
    entitlements:
      path: Kinora/Kinora.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
        # Home app scenes on playback start, pause and stop (Settings → Otthon).
        com.apple.developer.homekit: true
        # SharePlay: a watch party started from a FaceTime call.
        com.apple.developer.group-session: true
        # Push through the relay (docs/PUSH_RELAY.md); exporting for the App Store turns it into production.
        aps-environment: development
    info:
      path: Kinora/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
        # kinora://item/42 and kinora://play/42, opened by the widgets.
        CFBundleURLTypes:
          - CFBundleURLName: $(KINORA_BUNDLE_ID)
            CFBundleURLSchemes: [kinora]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        # Handoff: the title playing here continues on the user's other iPhone or iPad.
        NSUserActivityTypes: [$(KINORA_BUNDLE_ID).watching]
        # Downloads and the watch party on the lock screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # Joining a watch party by its QR code.
        NSHomeKitUsageDescription: A Kinora a lejátszás indulásakor, szünetekor és végén lefuttatja az általad választott Otthon-jelenetet, például lekapcsolja a lámpákat.
        NSCameraUsageDescription: A kamerával a watch party QR-kódját olvashatod be, hogy csatlakozz.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The user picks the server, and self-hosted servers often answer on plain HTTP,
        # at home and at a public address alike (http://203.0.113.5:8096). iOS ignores
        # NSAllowsArbitraryLoads when NSAllowsLocalNetworking is also set, so only this one.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: A Kinora a helyi hálózaton keresi és éri el a médiaszerveredet.
  KinoraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KinoraWidgets
      # The Live Activity attributes; the app starts the activities, the widgets draw them.
      - Kinora/App/LiveActivityAttributes.swift
    dependencies:
      - package: KinoraKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID).widgets
        PRODUCT_NAME: KinoraWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: KinoraWidgets/KinoraWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
    info:
      path: KinoraWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # The iMessage app: watch party invites, title recommendations and stickers.
  KinoraMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: KinoraMessages
      # The foyer palette and buttons, shared with the app.
      - Kinora/App/Theme.swift
    dependencies:
      - package: KinoraKit
      - sdk: Messages.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID).messages
        PRODUCT_NAME: KinoraMessages
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
    # The App Group carries the login (ServerStore.shared) and the downloaded language.
    entitlements:
      path: KinoraMessages/KinoraMessages.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
    info:
      path: KinoraMessages/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # Decrypts the push notifications the relay forwards and adds the poster.
  KinoraNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: KinoraNotifications
    dependencies:
      - package: KinoraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID).notifications
        PRODUCT_NAME: KinoraNotifications
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    # The App Group carries the pairing keys and the login token (for the poster).
    entitlements:
      path: KinoraNotifications/KinoraNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
    info:
      path: KinoraNotifications/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # Apple TV app. Same bundle ID as the iPhone app (universal purchase: one App Store
  # record). It shares the model, player logic and artwork code with the iPhone app; the
  # screens in KinoraTV/ are built for the Siri Remote and focus.
  KinoraTV:
    type: application
    platform: tvOS
    sources:
      - path: KinoraTV
      - Kinora/App/AppModel.swift
      - Kinora/App/Haptics.swift
      - Kinora/App/HomeScenes.swift
      - Kinora/App/Preferences.swift
      - Kinora/App/ProgressQueue.swift
      - Kinora/App/Snowfall.swift
      - Kinora/App/Theme.swift
      - Kinora/Features/Browse/Artwork.swift
      - Kinora/Features/Browse/ScoresViews.swift
      - Kinora/Features/Player/PlayerModel.swift
      - Kinora/Features/Party/PartySession.swift
      - Kinora/Features/Party/PartyViews.swift
    dependencies:
      - package: KinoraKit
      - target: KinoraTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID)
        PRODUCT_NAME: Kinora
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: KinoraTV/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: $(KINORA_BUNDLE_ID)
            CFBundleURLSchemes: [kinora]
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: A Kinora a helyi hálózaton keresi és éri el a médiaszerveredet.
        NSHomeKitUsageDescription: A Kinora a lejátszás indulásakor, szünetekor és végén lefuttatja az általad választott Otthon-jelenetet, például lekapcsolja a lámpákat.
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
    # The App Group carries the saved servers and the login token to the Top Shelf extension.
    entitlements:
      path: KinoraTV/KinoraTV.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
        # Home app scenes on playback start, pause and stop (Beállítások → Otthon-jelenetek).
        com.apple.developer.homekit: true
  # Top Shelf of the Apple TV home screen: Continue watching and new titles above the apps
  # while the Kinora icon has the focus.
  KinoraTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: KinoraTopShelf
    dependencies:
      - package: KinoraKit
      - sdk: TVServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID).topshelf
        PRODUCT_NAME: KinoraTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: KinoraTopShelf/KinoraTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
    info:
      path: KinoraTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
schemes:
  Kinora:
    build:
      targets:
        Kinora: all
    run:
      config: Debug
    archive:
      config: Release
  KinoraTV:
    build:
      targets:
        KinoraTV: all
    run:
      config: Debug
    archive:
      config: Release
